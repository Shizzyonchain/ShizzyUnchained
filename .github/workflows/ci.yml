name: Application CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:source-text
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:subnet-news
      - run: npm run lint
      - run: npm test
      - name: Install bounded browser runtime
        run: npx playwright install --with-deps chromium
      - name: Production build against isolated smoke backend
        run: npm run build:smoke
      - name: Desktop and phone visitor gates
        run: npm run test:smoke
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visitor-smoke-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests
      - run: python -m pytest -q
